name: VeriWork CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Python syntax
        run: python -m py_compile server.py tools/run_checks.py
      - name: Backend and integration tests
        run: python -m unittest discover -s tests -v
      - name: Frontend smoke test
        run: node tests/frontend_smoke.js
