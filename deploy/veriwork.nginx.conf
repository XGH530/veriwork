location = /veriwork {
    return 301 /veriwork/;
}

# Exact sensitive files must be blocked before the proxy fallback.
location = /veriwork/.env { return 404; }
location = /veriwork/.env.example { return 404; }
location = /veriwork/server.py { return 404; }
location = /veriwork/requirements.txt { return 404; }
location = /veriwork/README.md { return 404; }
location = /veriwork/Dockerfile { return 404; }
location = /veriwork/Procfile { return 404; }
location = /veriwork/render.yaml { return 404; }

# Prefix denies for repository/runtime directories.
location ^~ /veriwork/.git/ { return 404; }
location ^~ /veriwork/data/ { return 404; }
location ^~ /veriwork/docs/ { return 404; }
location ^~ /veriwork/deploy/ { return 404; }
location ^~ /veriwork/tests/ { return 404; }
location ^~ /veriwork/tools/ { return 404; }
location ^~ /veriwork/submission/ { return 404; }
location ^~ /veriwork/results/ { return 404; }
location ^~ /veriwork/work/ { return 404; }

# ^~ prevents Baota's generic js/css regex location from hijacking frontend assets.
location ^~ /veriwork/ {
    limit_except GET POST {
        deny all;
    }

    proxy_pass http://127.0.0.1:8000/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /veriwork;
    proxy_read_timeout 120;
    proxy_connect_timeout 10;
    proxy_send_timeout 120;
    client_max_body_size 16m;
}

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
