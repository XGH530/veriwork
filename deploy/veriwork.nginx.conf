# VeriWork Nginx guard
# Include this file inside the target server { } block.
# Sensitive repository and runtime files must never be reachable through the web root.

location = /veriwork {
    return 301 /veriwork/;
}

# Deny repository directories and dotfiles before proxy handling.
location ~* ^/veriwork/(?:\.|data(?:/|$)|docs(?:/|$)|deploy(?:/|$)|tests(?:/|$)|tools(?:/|$)|submission(?:/|$)|results(?:/|$)|work(?:/|$)) {
    return 404;
}

# Defense in depth: deny database, environment, source and deployment artefacts by suffix.
location ~* ^/veriwork/.*\.(?:db|sqlite|sqlite3|db-wal|db-shm|env|py|pyc|pem|key|md|txt|log|ini|conf|service|sh|bat|ps1|toml|ya?ml|bak|sql)$ {
    return 404;
}

location /veriwork/ {
    limit_except GET POST {
        deny all;
    }

    proxy_pass http://127.0.0.1:8000/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /veriwork;
    proxy_read_timeout 120;
    proxy_connect_timeout 10;
    proxy_send_timeout 120;
    client_max_body_size 16m;
}

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
